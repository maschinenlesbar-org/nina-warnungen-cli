# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Das **Warnsystem des Bevölkerungsschutzes** des Bundes direkt im Terminal abfragen. `nina`
    ist ein Kommandozeilen-Tool für die offene [NINA-API](https://nina.api.bund.dev/)
    (`warnung.bund.de`): aktuelle Warnungen nach Quelle abrufen, Details oder Geometrie jeder
    Warnung nachschlagen, eine Region anhand ihres amtlichen Schlüssels prüfen und das
    MoWaS-Archiv durchsuchen – als sauberes JSON, das Sie direkt an
    [`jq`](https://jqlang.github.io/jq/) weitergeben können.
